[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "s2n"
license = "MIT"
license-files = ["LICENSE"]
version = "0.3.2"
description = "Plugin-based web vulnerability scanner library"

readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name="503+1", email="imapversion4@gmail.com"}
]
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.12",
    "selenium>=4.20",
    "webdriver-manager",
    "click>=8.0",
    "rich>=13.0",
    "PyJWT>=2.8.0",
    "cryptography>=41.0.0",
]

[project.urls]
Homepage = "https://github.com/504s2n/s2n"
Repository = "https://github.com/504s2n/s2n"
Issues = "https://github.com/504s2n/s2n/issues"

[project.optional-dependencies]
dev = ["pytest", "responses", "pytest-cov", "build", "twine", "ruff", "mypy"]
ai = ["s2n-agent>=0.1.0"]

[project.scripts]
s2n = "s2n.s2nscanner.cli.runner:cli"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["test*", "tests*"]

[tool.setuptools]
py-modules = ["native_host"]

[tool.setuptools.package-data]
"s2n.s2nscanner.plugins.xss" = ["xss_payloads.json"]
"s2n.s2nscanner.plugins.sqlinjection" = ["sqli_payloads.json"]
"s2n.s2nscanner.plugins.jwt" = ["weak_secrets.txt"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
    "slow: long-running tests",
    "dvwa: tests requiring a DVWA server",
]

[tool.ruff]
target-version = "py39"
exclude = [".envs", "extension", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"s2n/s2nscanner/plugins/csrf/csrf_constants.py" = ["F401"]
